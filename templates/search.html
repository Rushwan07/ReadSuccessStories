{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ Text }} | Success Stories</title>

    <!-- Bootstrap CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="bg-success text-white py-4">
        <div class="container">
            <h1 class="h2 text-center mb-0">{{ Text }}</h1>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <div class="row g-3 g-md-4">

            {% for post in Allpost %}
            <div class="col-12 col-sm-6 col-lg-4">
                <article
                    class="card h-100 border-0 shadow-sm"
                    role="link"
                    tabindex="0"
                    aria-label="Read {{ post.name }}'s story"
                    onclick="openWindow('{{ post.slug|escapejs }}')"
                    onkeydown="if(event.key === 'Enter' || event.key === ' '){event.preventDefault(); openWindow('{{ post.slug|escapejs }}');}">

                    {% if post.image %}
                    <img
                        src="{{ post.image.url }}"
                        class="card-img-top img-fluid"
                        alt="{{ post.name }}"
                        loading="lazy">
                    {% endif %}

                    <div class="card-body d-flex flex-column">
                        <h2 class="h5 card-title fw-bold mb-1">
                            {{ post.name }}
                        </h2>

                        <p class="text-secondary small mb-3">
                            @{{ post.username }}
                        </p>

                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <span class="text-success fw-semibold small">
                                Read story
                            </span>
                            <span class="text-success" aria-hidden="true">↗</span>
                        </div>
                    </div>

                </article>
            </div>
            {% empty %}
            <div class="col-12">
                <p class="alert alert-secondary text-center mb-0">
                    No stories found.
                </p>
            </div>
            {% endfor %}

        </div>
    </main>

    <script>
        function openWindow(slug) {
            window.location.href = "/" + encodeURIComponent(slug);
        }
    </script>

</body>
</html>
